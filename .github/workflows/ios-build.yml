name: Build IPA

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "Building marketing version 0.1.0, CI build ${BUILD_NUMBER}"
          xcodebuild archive \
            -project Suzuri.xcodeproj \
            -scheme Suzuri \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Suzuri.xcarchive \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Suzuri.xcarchive/Products/Applications/Suzuri.app build/Payload/
          cd build && zip -qr Suzuri-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Suzuri-IPA
          path: build/Suzuri-unsigned.ipa
          if-no-files-found: error