name: Build IPA

on:
  push:
    tags: ['v*']
    branches: [main, codex/suzuri-usability-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.3"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "Building marketing version 0.2.0, CI build ${BUILD_NUMBER}"
          xcodebuild archive \
            -project Suzuri.xcodeproj \
            -scheme Suzuri \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Suzuri.xcarchive \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Suzuri.xcarchive/Products/Applications/Suzuri.app build/Payload/
          cd build && zip -qr Suzuri-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Suzuri-IPA
          path: build/Suzuri-unsigned.ipa
          if-no-files-found: error

      - name: Publish downloadable preview
        if: github.ref == 'refs/heads/codex/suzuri-usability-redesign'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_TAG: suzuri-preview-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cat > build/preview-notes.md <<'NOTES'
          Suzuri 界面重构预览版。

          - 附件为未签名的 iOS IPA。安装前需要使用支持的侧载工具和自己的签名账号重新签名，不能直接从浏览器安装。
          - 编译与 XCTest 独立运行；此预览发布只表示 IPA 构建成功，不代表测试已完成或通过。
          - 请在 Actions 的 iOS Tests 工作流核对相同提交的测试结果。
          - 本预览来自开发分支，未合并 main，也不是 App Store / TestFlight 正式版本。
          NOTES
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> build/preview-notes.md
          gh release create "$PREVIEW_TAG" build/Suzuri-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Suzuri preview $PREVIEW_TAG" \
            --notes-file build/preview-notes.md
