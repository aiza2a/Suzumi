name: iOS Release

on:
  push:
    tags: ['v*']

# Required repository secrets before enabling TestFlight delivery:
# IOS_CERT_P12, IOS_CERT_PASSWORD, IOS_PROVISIONING_PROFILE (base64),
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Import signing
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERT_P12 }}
          p12-password: ${{ secrets.IOS_CERT_PASSWORD }}
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          test -n "$IOS_PROVISIONING_PROFILE"
          profile_path="$RUNNER_TEMP/Suzuri.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/SuzuriProfile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$RUNNER_TEMP/SuzuriProfile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
      - run: brew install xcodegen && xcodegen generate
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project Suzuri.xcodeproj -scheme Suzuri \
            -configuration Release -archivePath build/Suzuri.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" archive
      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          sed 's/\$(TEAM_ID_PLACEHOLDER)/'"$APPLE_TEAM_ID"'/g' \
            .github/exportOptions.plist > "$RUNNER_TEMP/exportOptions.plist"
          xcodebuild -exportArchive -archivePath build/Suzuri.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath build/export
      - uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/export/Suzuri.ipa
          apple-id: ${{ secrets.APPLE_ID }}
          app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
