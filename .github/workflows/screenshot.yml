name: Screenshot Preview
on:
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project Suzuri.xcodeproj -scheme Suzuri \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Boot sim & launch
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl install booted build/Build/Products/Release-iphonesimulator/Suzuri.app
          xcrun simctl launch booted com.suzuri.app
          sleep 5
          xcrun simctl io booted screenshot light.png
          xcrun simctl ui booted appearance dark
          sleep 2
          xcrun simctl io booted screenshot dark.png
          xcrun simctl ui booted appearance light
          xcrun simctl terminate booted com.suzuri.app
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: '*.png'