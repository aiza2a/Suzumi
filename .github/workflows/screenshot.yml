name: Screenshot Preview
on:
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build simulator app
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available \
            | sed -nE '/iPhone 16 \(/s/.*\(([0-9A-Fa-f-]{36})\).*/\1/p' \
            | head -n 1)"
          if [[ -z "$simulator_udid" ]]; then
            simulator_udid="$(xcrun simctl list devices available \
              | sed -nE '/iPhone/s/.*\(([0-9A-Fa-f-]{36})\).*/\1/p' \
              | head -n 1)"
          fi
          test -n "$simulator_udid"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcodebuild -project Suzuri.xcodeproj -scheme Suzuri \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Boot sim & launch
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl install "$SIMULATOR_UDID" build/Build/Products/Release-iphonesimulator/Suzuri.app
          xcrun simctl launch "$SIMULATOR_UDID" com.suzuri.app
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot light.png
          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
          sleep 2
          xcrun simctl io "$SIMULATOR_UDID" screenshot dark.png
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl terminate "$SIMULATOR_UDID" com.suzuri.app
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: '*.png'
          if-no-files-found: error