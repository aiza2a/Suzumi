name: Suzuri
options:
  bundleIdPrefix: com.suzuri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Suzuri:
    type: application
    platform: iOS
    sources: [Suzuri]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suzuri.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "拍摄照片并在你确认后上传到所选图床。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "选择要插入文章的图片。"
        CODE_SIGNING_ALLOWED: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.2.0
        SWIFT_VERSION: "5"
  SuzuriTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SuzuriTests]
    settings:
      base:
        SWIFT_VERSION: "5"
    dependencies:
      - target: Suzuri
schemes:
  Suzuri:
    build:
      targets: {Suzuri: all}
    test:
      targets: [SuzuriTests]
